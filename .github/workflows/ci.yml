name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit + E2E + a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bunx vitest run --reporter=verbose --exclude "src/tests/{a11y,toast-a11y,toast-focus-sequence,toast-close-keyboard,fund-source-reload-recovery,delete-undo-flow,fund-source-add-flow}.test.tsx"

      - name: E2E flows
        run: bunx vitest run src/tests/fund-source-reload-recovery.test.tsx src/tests/fund-source-add-flow.test.tsx src/tests/delete-undo-flow.test.tsx src/tests/toast-close-keyboard.test.tsx

      - name: Accessibility (axe-core)
        run: bunx vitest run src/tests/a11y.test.tsx src/tests/toast-a11y.test.tsx src/tests/toast-focus-sequence.test.tsx

      - name: Production build
        run: bun run build
